{% extends 'base.html' %}

{% block content %}
<div class="module-header">
    <h1>Welcome Back</h1>
    <p class="subtitle">Log in to continue your learning journey.</p>
</div>

<div class="ds-card" style="max-width: 440px; margin: 0 auto;">
    <form action="/login" method="POST" class="ds-flex-col ds-gap-4">
        <div>
            <label for="login-email">Email</label>
            <input id="login-email" type="email" name="email" required autocomplete="email">
        </div>
        <div>
            <label for="login-password">Password</label>
            <input id="login-password" type="password" name="password" required autocomplete="current-password">
        </div>
        <button type="submit" class="ds-btn ds-btn-primary" style="width: 100%;">Login</button>
    </form>
    <p class="ds-text-center ds-mt-6" style="margin-bottom:0;">
        Don't have an account?
        <a href="/register" class="ds-text-primary" style="font-weight: var(--ds-weight-title); text-decoration: none;">Register here</a>
    </p>

    <div class="ds-mt-6" style="padding-top: var(--ds-space-4); border-top: 1px solid var(--ds-border); text-align: center;">
        <p class="ds-text-muted ds-mb-2" style="font-size: var(--ds-fs-small);">For instructors</p>
        <a href="/demo" class="ds-btn ds-btn-outline ds-btn-sm">Enable Demo Mode</a>
    </div>
</div>
{% endblock %}
