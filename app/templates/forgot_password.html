{% extends 'base.html' %}

{% block content %}
<div class="module-header">
    <h1>Forgot your password?</h1>
    <p class="subtitle">Enter your email and we will issue a single-use reset link.</p>
</div>

<div class="ds-card" style="max-width: 440px; margin: 0 auto;">
    <form method="POST" action="{{ url_for('auth.forgot_password') }}" class="ds-flex-col ds-gap-4">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <div>
            <label for="forgot-email">Email</label>
            <input id="forgot-email" type="email" name="email" required autocomplete="email" maxlength="254">
        </div>
        <button type="submit" class="ds-btn ds-btn-primary" style="width: 100%;">Send reset link</button>
    </form>
    <p class="ds-text-center ds-mt-6" style="margin-bottom:0;">
        <a href="{{ url_for('auth.login') }}" class="ds-text-primary" style="font-weight: var(--ds-weight-title); text-decoration: none;">
            ← Back to login
        </a>
    </p>
</div>
{% endblock %}
