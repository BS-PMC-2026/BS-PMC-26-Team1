{% extends 'base.html' %}

{% block content %}
<div class="module-header">
    <h1>Something went wrong on our side</h1>
    <p class="subtitle">The error has been logged. Please try again in a moment.</p>
</div>

<div class="ds-card" style="max-width: 560px; margin: 0 auto; text-align: center;">
    <div style="font-size: 56px; line-height: 1; margin-bottom: var(--ds-space-3);">⚠️</div>
    <p>If the problem persists, contact the platform administrator with the time of the error.</p>
    <div class="action-container">
        <a href="/" class="ds-btn ds-btn-primary">Back to home</a>
    </div>
</div>
{% endblock %}
