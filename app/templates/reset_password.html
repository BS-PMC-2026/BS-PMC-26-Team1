{% extends 'base.html' %}

{% block content %}
<div class="module-header">
    <h1>Choose a new password</h1>
    <p class="subtitle">For your security this link can be used only once.</p>
</div>

<div class="ds-card" style="max-width: 440px; margin: 0 auto;">
    <form method="POST" action="{{ url_for('auth.reset_password', token=token) }}" class="ds-flex-col ds-gap-4">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <div>
            <label for="reset-password">New password</label>
            <input id="reset-password" type="password" name="password" minlength="8" required autocomplete="new-password">
        </div>
        <div>
            <label for="reset-confirm">Confirm new password</label>
            <input id="reset-confirm" type="password" name="confirm_password" minlength="8" required autocomplete="new-password">
        </div>
        <button type="submit" class="ds-btn ds-btn-primary" style="width: 100%;">Update password</button>
    </form>
</div>
{% endblock %}
