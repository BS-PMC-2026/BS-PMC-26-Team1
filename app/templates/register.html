{% extends 'base.html' %}

{% block content %}
<div class="module-header">
    <h1>Create an Account</h1>
    <p class="subtitle">Join the platform as a Student or Lecturer.</p>
</div>

<div class="ds-card" style="max-width: 520px; margin: 0 auto;">
    <form action="/register" method="POST" class="ds-flex-col ds-gap-4">
        <div>
            <label for="reg-username">Username</label>
            <input id="reg-username" type="text" name="username" required autocomplete="username">
        </div>
        <div>
            <label for="reg-fullname">Full Name</label>
            <input id="reg-fullname" type="text" name="full_name" required autocomplete="name">
        </div>
        <div>
            <label for="reg-email">Email</label>
            <input id="reg-email" type="email" name="email" required autocomplete="email">
        </div>
        <div>
            <label for="reg-password">Password</label>
            <input id="reg-password" type="password" name="password" minlength="8" required autocomplete="new-password">
        </div>
        <div>
            <label for="reg-confirm">Confirm Password</label>
            <input id="reg-confirm" type="password" name="confirm_password" minlength="8" required autocomplete="new-password">
        </div>
        <div>
            <label for="reg-role">Role</label>
            <select id="reg-role" name="role" required>
                <option value="student" {% if request.args.get('role') == 'student' %}selected{% endif %}>Student</option>
                <option value="lecturer" {% if request.args.get('role') == 'lecturer' %}selected{% endif %}>Lecturer</option>
            </select>
        </div>
        <button type="submit" class="ds-btn ds-btn-primary" style="width: 100%;">Register</button>
    </form>
    <p class="ds-text-center ds-mt-6" style="margin-bottom:0;">
        Already have an account?
        <a href="/login" class="ds-text-primary" style="font-weight: var(--ds-weight-title); text-decoration: none;">Login here</a>
    </p>
</div>
{% endblock %}
