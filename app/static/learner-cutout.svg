<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 520" role="img" aria-label="Student learning illustration">
  <defs>
    <linearGradient id="bg" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#BCB7FF"/>
      <stop offset="100%" stop-color="#CEE8FF"/>
    </linearGradient>
    <linearGradient id="laptop" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#5750E5"/>
      <stop offset="100%" stop-color="#9089F0"/>
    </linearGradient>
  </defs>

  <!-- Halo circle (mint) -->
  <circle cx="260" cy="280" r="220" fill="url(#bg)"/>

  <!-- Floating decorative shapes -->
  <circle cx="80"  cy="120" r="22" fill="#BCF4DF"/>
  <circle cx="455" cy="90"  r="14" fill="#FFE867"/>
  <circle cx="475" cy="320" r="18" fill="#BCB7FF"/>
  <circle cx="55"  cy="380" r="12" fill="#FF4343"/>

  <!-- Books on the left -->
  <g transform="translate(72 270) rotate(-12)">
    <rect width="46" height="64" rx="6" fill="#5750E5"/>
    <rect y="64" width="46" height="64" rx="6" fill="#10B981"/>
    <rect y="128" width="46" height="64" rx="6" fill="#FFD575"/>
  </g>

  <!-- Person silhouette -->
  <g transform="translate(160 90)">
    <!-- Hair / head back -->
    <path d="M75 22c50 0 86 28 86 70 0 14-4 26-10 36-5 8-7 14-5 22l4 16c2 8-3 14-11 14H22c-8 0-13-6-11-14l4-16c2-8 0-14-5-22-6-10-10-22-10-36 0-42 36-70 75-70z" fill="#1F1B11"/>
    <!-- Face -->
    <ellipse cx="80" cy="100" rx="62" ry="64" fill="#E8B79A"/>
    <!-- Eyes -->
    <circle cx="58" cy="100" r="4.5" fill="#1F1B11"/>
    <circle cx="100" cy="100" r="4.5" fill="#1F1B11"/>
    <!-- Smile -->
    <path d="M62 120 Q80 132 98 120" stroke="#1F1B11" stroke-width="4" fill="none" stroke-linecap="round"/>
    <!-- Beard hint -->
    <path d="M48 116 Q80 148 112 116 Q108 134 80 138 Q52 134 48 116z" fill="#1F1B11" opacity="0.85"/>
    <!-- Neck -->
    <rect x="64" y="158" width="32" height="22" rx="4" fill="#E8B79A"/>
    <!-- Shirt (plaid green/dark) -->
    <path d="M0 200 Q0 178 30 174 L60 168 L100 168 L130 174 Q160 178 160 200 L160 320 L0 320 Z" fill="#10B981"/>
    <!-- Shirt collar -->
    <path d="M58 168 L80 200 L102 168 L96 168 L80 188 L64 168 Z" fill="#0E8B66"/>
    <!-- T-shirt -->
    <path d="M58 168 L80 200 L102 168 L102 220 L58 220 Z" fill="#FEEECA"/>
  </g>

  <!-- Laptop -->
  <g transform="translate(168 350)">
    <rect x="-6" y="64" width="216" height="14" rx="6" fill="#080D19"/>
    <rect width="204" height="68" rx="8" fill="url(#laptop)"/>
    <rect x="14" y="10" width="176" height="48" rx="4" fill="#080D19" opacity="0.18"/>
    <!-- Window prompts -->
    <rect x="22" y="18" width="60" height="6" rx="3" fill="#FFFFFF" opacity="0.85"/>
    <rect x="22" y="30" width="100" height="6" rx="3" fill="#FFFFFF" opacity="0.6"/>
    <rect x="22" y="42" width="76" height="6" rx="3" fill="#FFFFFF" opacity="0.5"/>
  </g>

  <!-- Floating "G" Google-style chip -->
  <g transform="translate(412 130)">
    <circle r="26" fill="#FFFFFF" stroke="rgba(8,13,25,0.08)"/>
    <text x="0" y="9" text-anchor="middle" font-family="Assistant, sans-serif" font-weight="800" font-size="28" fill="#5750E5">G</text>
  </g>

  <!-- Floating star chip -->
  <g transform="translate(96 78)">
    <circle r="22" fill="#FFE867"/>
    <path d="M0 -10 L3 -3 L10 -3 L4 1 L6 8 L0 4 L-6 8 L-4 1 L-10 -3 L-3 -3 Z" fill="#FFFFFF"/>
  </g>

  <!-- Floating "Learn" pill -->
  <g transform="translate(390 360)">
    <rect x="-58" y="-18" width="116" height="36" rx="18" fill="#5750E5"/>
    <text x="0" y="6" text-anchor="middle" font-family="Assistant, sans-serif" font-weight="800" font-size="16" fill="#FFFFFF">Learn ✦</text>
  </g>
</svg>
