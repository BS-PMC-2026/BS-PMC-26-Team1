<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" role="img" aria-label="Student with glasses">
  <defs><clipPath id="c3"><rect width="160" height="200" x="20" y="20" rx="80 80 12 12"/></clipPath></defs>
  <g clip-path="url(#c3)">
    <rect width="200" height="240" fill="#FEEECA"/>
    <!-- body shirt (deep red plaid) -->
    <path d="M40 240 Q40 170 100 170 Q160 170 160 240 Z" fill="#A33A2C"/>
    <!-- shirt stripes -->
    <path d="M40 200 L160 200" stroke="#7A2A20" stroke-width="3"/>
    <path d="M40 220 L160 220" stroke="#7A2A20" stroke-width="3"/>
    <!-- inner t-shirt -->
    <path d="M70 240 Q70 200 100 200 Q130 200 130 240 Z" fill="#FEEECA"/>
    <!-- backpack strap -->
    <rect x="60" y="186" width="8" height="54" fill="#1F1B11"/>
    <rect x="132" y="186" width="8" height="54" fill="#1F1B11"/>
    <!-- neck -->
    <rect x="86" y="148" width="28" height="22" rx="4" fill="#E8B79A"/>
    <!-- head -->
    <ellipse cx="100" cy="120" rx="46" ry="48" fill="#E8B79A"/>
    <!-- hair (short with side part) -->
    <path d="M55 108 Q60 62 100 60 Q142 60 145 110 Q138 88 124 84 L80 84 Q66 90 55 108z" fill="#241509"/>
    <!-- glasses -->
    <circle cx="82" cy="120" r="11" fill="none" stroke="#1F1B11" stroke-width="2.5"/>
    <circle cx="118" cy="120" r="11" fill="none" stroke="#1F1B11" stroke-width="2.5"/>
    <line x1="93" y1="120" x2="107" y2="120" stroke="#1F1B11" stroke-width="2.5"/>
    <!-- eyes -->
    <circle cx="82" cy="120" r="2.8" fill="#1F1B11"/>
    <circle cx="118" cy="120" r="2.8" fill="#1F1B11"/>
    <!-- light beard -->
    <path d="M62 132 Q75 158 100 162 Q125 158 138 132 Q126 146 100 148 Q74 146 62 132z" fill="#241509" opacity="0.8"/>
    <!-- smile -->
    <path d="M86 138 Q100 146 114 138" stroke="#1F1B11" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>
</svg>
