    <ellipse cx="100" cy="120" rx="46" ry="48" fill="#E8B79A"/>
    <!-- hair (longer) -->
    <path d="M52 116 Q56 60 100 60 Q146 60 148 116 Q140 100 132 96 L72 96 Q60 102 52 116z" fill="#3D2914"/>
    <path d="M50 116 L52 168 Q58 170 60 162 Q60 140 56 122 Z" fill="#3D2914"/>
