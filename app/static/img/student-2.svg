<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" role="img" aria-label="Student holding books">
  <defs><clipPath id="c2"><rect width="160" height="200" x="20" y="20" rx="80 80 12 12"/></clipPath></defs>
  <g clip-path="url(#c2)">
    <rect width="200" height="240" fill="#FEEECA"/>
    <!-- body -->
    <path d="M40 240 Q40 170 100 170 Q160 170 160 240 Z" fill="#FFD575"/>
    <!-- neck -->
    <rect x="86" y="148" width="28" height="22" rx="4" fill="#E8B79A"/>
