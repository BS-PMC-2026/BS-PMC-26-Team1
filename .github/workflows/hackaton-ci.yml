name: Hackaton 2026 CI

on:
  push:
    branches: [hackaton_2026, develop, main]
  pull_request:
    branches: [hackaton_2026, develop, main]
  workflow_dispatch:

jobs:
  hackaton-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Check Python syntax
        run: |
          python -m compileall app app.py tests

      - name: Validate project structure
        run: |
          test -f app.py
          test -d app
          test -d tests
          test -f requirements.txt
          echo "Project structure validation passed"

      - name: Run Hackaton related tests if available
        run: |
          TEST_FILES=""

          for file in \
            tests/test_homepage.py \
            tests/test_lecturer.py \
            tests/test_progress.py \
            tests/test_pipeline.py \
            tests/test_routes.py \
            tests/test_integration.py
          do
            if [ -f "$file" ]; then
              TEST_FILES="$TEST_FILES $file"
            fi
          done

          if [ -z "$TEST_FILES" ]; then
            echo "No specific hackaton test files found. Running all available tests."
            pytest tests -v
          else
            echo "Running hackaton test files: $TEST_FILES"
            pytest $TEST_FILES -v
          fi
