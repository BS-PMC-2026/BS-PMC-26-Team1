name: Hackaton 2026 CI

on:
  push:
    branches: [hackaton_2026, develop, main]
  pull_request:
    branches: [hackaton_2026, develop, main]
  workflow_dispatch:

jobs:
  hackaton-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Check Python syntax
        run: |
          python -m compileall app app.py tests

      - name: Validate project structure
        run: |
          test -f app.py
          test -d app
          test -d tests
          test -f requirements.txt
          test -f app/services/code_runner_service.py
          test -f app/routes/lecturer.py
          test -f .github/workflows/hackaton-ci.yml
          echo "Project structure validation passed"

      - name: Run stable Hackaton tests
        run: |
          TEST_FILES=""

          for file in \
            tests/test_basic.py \
            tests/test_code_runner.py \
            tests/test_seed.py
          do
            if [ -f "$file" ]; then
              TEST_FILES="$TEST_FILES $file"
            fi
          done

          if [ -z "$TEST_FILES" ]; then
            echo "No stable test files found. Syntax and structure validation passed."
          else
            echo "Running stable hackaton tests: $TEST_FILES"
            pytest $TEST_FILES -v
          fi
