name: Hackaton 2026 CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

jobs:
  hackaton-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Check Python syntax
        run: |
          python -m compileall .

      - name: Validate Flask application import
        run: |
          python -c "import app; print('Flask app import passed')"

      - name: Run Hackaton related tests
        run: |
          pytest tests/test_homepage.py tests/test_lecturer.py tests/test_progress.py tests/test_pipeline.py tests/test_routes.py tests/test_integration.py -v
