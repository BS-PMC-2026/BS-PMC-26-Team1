name: CI - Test, Coverage and Azure Readiness

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.11"
  FLASK_ENV: "testing"
  USE_SQLSERVER: "0"
  DATABASE_URL: "sqlite:///:memory:"
  SECRET_KEY: "github-actions-test-secret"

  # Azure resources created for Sprint 3 deployment-readiness evidence
  AZURE_WEBAPP_NAME: "s-y-i-b-team-test-app-sce"
  AZURE_RESOURCE_GROUP: "bs-pm-2026-team1"
  AZURE_SQL_SERVER_NAME: "azure-s-y-i-b-team1-sql-server"
  AZURE_SQL_DATABASE_NAME: "db-app-test"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-coverage:
    name: Build, Test and Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Show environment information
        run: |
          python --version
          python -m pip --version
          echo "Branch: $GITHUB_REF_NAME"
          echo "Commit: $GITHUB_SHA"
          echo "Azure Web App: $AZURE_WEBAPP_NAME"
          echo "Azure Resource Group: $AZURE_RESOURCE_GROUP"
          echo "Azure SQL Server: $AZURE_SQL_SERVER_NAME"
          echo "Azure SQL Database: $AZURE_SQL_DATABASE_NAME"

      - name: Clean local development files from runner
        run: |
          rm -rf .venv venv env __pycache__ .pytest_cache htmlcov
          find . -type d -name "__pycache__" -prune -exec rm -rf {} +

      - name: Install system packages for pyodbc
        run: |
          sudo apt-get update
          sudo apt-get install -y unixodbc-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          fi
          python -m pip install pytest pytest-cov flake8

       - name: Lint critical Python errors only
        run: |
          python -m flake8 . \
            --exclude=.git,.venv,venv,env,__pycache__,.pytest_cache,htmlcov \
            --count \
            --select=E9,F63,F7,F82 \
            --show-source \
            --statistics

      - name: Check Python syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import py_compile

          excluded = {".git", ".venv", "venv", "env", "__pycache__", ".pytest_cache", "htmlcov"}
          files = [p for p in Path(".").rglob("*.py") if not any(part in excluded for part in p.parts)]

          for file_path in files:
              py_compile.compile(str(file_path), doraise=True)

          print(f"Compiled {len(files)} Python files successfully")
          PY

      - name: Validate Flask application boots
        run: |
          export PYTHONPATH="$PWD"
          python -c "from app import create_app; app = create_app(); print('APP OK:', app.name)"

      - name: Run tests and coverage
        run: |
          export PYTHONPATH="$PWD"
          python -m pytest tests \
            -v \
            --junitxml=pytest_junit_report.xml \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-report=html:htmlcov

      - name: Upload test and coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-test-and-coverage-evidence
          path: |
            pytest_junit_report.xml
            coverage.xml
            htmlcov/
          if-no-files-found: ignore

  azure-readiness:
    name: Azure Deployment Readiness Check
    runs-on: ubuntu-latest
    needs: build-test-coverage
    timeout-minutes: 10

    env:
      AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}

    steps:
      - name: Print Azure deployment-readiness configuration
        run: |
          echo "Azure deployment-readiness resources for Sprint 3:"
          echo "Resource Group: $AZURE_RESOURCE_GROUP"
          echo "App Service: $AZURE_WEBAPP_NAME"
          echo "SQL Server: $AZURE_SQL_SERVER_NAME"
          echo "SQL Database: $AZURE_SQL_DATABASE_NAME"
          echo ""
          echo "This workflow validates code, tests, coverage, and Azure readiness."
          echo "Real Azure checks run only when AZURE_CREDENTIALS secret exists."

      - name: Azure login
        if: env.AZURE_CREDENTIALS != ''
        uses: azure/login@v2
        with:
          creds: ${{ env.AZURE_CREDENTIALS }}

      - name: Check Azure App Service status
        if: env.AZURE_CREDENTIALS != ''
        continue-on-error: true
        run: |
          az webapp show \
            --name "$AZURE_WEBAPP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --query "{name:name,state:state,availabilityState:availabilityState,defaultHostName:defaultHostName,resourceGroup:resourceGroup}" \
            --output table

      - name: Check Azure SQL Database status
        if: env.AZURE_CREDENTIALS != ''
        continue-on-error: true
        run: |
          az sql db show \
            --server "$AZURE_SQL_SERVER_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_SQL_DATABASE_NAME" \
            --query "{name:name,status:status,edition:edition,serviceObjectiveName:serviceObjectiveName}" \
            --output table

      - name: Skip Azure checks when secret is missing
        if: env.AZURE_CREDENTIALS == ''
        run: |
          echo "AZURE_CREDENTIALS secret is not configured, so real Azure CLI checks were skipped."
          echo "CI is still green because Azure readiness is documented as an optional validation step."
