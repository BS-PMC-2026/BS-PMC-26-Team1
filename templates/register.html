{% extends 'base.html' %}

{% block content %}
<div class="module-header">
    <h1>Create an Account</h1>
    <p class="subtitle">Join the platform as a Student or Lecturer</p>
</div>

<div class="card" style="max-width: 500px; margin: 0 auto;">
    <form action="/register" method="POST" style="display: flex; flex-direction: column; gap: 1rem;">
        <div>
            <label style="display:block; margin-bottom: 0.5rem;">Full Name</label>
            <input type="text" name="full_name" required style="width: 100%; padding: 0.75rem; border-radius: 4px; border: 1px solid #334155; background: #0f172a; color: white;">
        </div>
        <div>
            <label style="display:block; margin-bottom: 0.5rem;">Email</label>
            <input type="email" name="email" required style="width: 100%; padding: 0.75rem; border-radius: 4px; border: 1px solid #334155; background: #0f172a; color: white;">
        </div>
        <div>
            <label style="display:block; margin-bottom: 0.5rem;">Password</label>
            <input type="password" name="password" minlength="8" required style="width: 100%; padding: 0.75rem; border-radius: 4px; border: 1px solid #334155; background: #0f172a; color: white;">
        </div>
        <div>
            <label style="display:block; margin-bottom: 0.5rem;">Confirm Password</label>
            <input type="password" name="confirm_password" minlength="8" required style="width: 100%; padding: 0.75rem; border-radius: 4px; border: 1px solid #334155; background: #0f172a; color: white;">
        </div>
        <div>
            <label style="display:block; margin-bottom: 0.5rem;">Role</label>
            <select name="role" required style="width: 100%; padding: 0.75rem; border-radius: 4px; border: 1px solid #334155; background: #0f172a; color: white;">
                <option value="student" {% if request.args.get('role') == 'student' %}selected{% endif %}>Student</option>
                <option value="lecturer" {% if request.args.get('role') == 'lecturer' %}selected{% endif %}>Lecturer</option>
            </select>
        </div>
        <button type="submit" class="btn btn-primary" style="margin-top: 1rem; width: 100%;">Register</button>
    </form>
    <p style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem;">
        Already have an account? <a href="/login" style="color: var(--accent-color);">Login here</a>
    </p>
</div>
{% endblock %}
